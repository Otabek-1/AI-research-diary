[build]
  command = "npm run build"

# GITHUB_OWNER / GITHUB_REPO / GITHUB_BRANCH are public repository coordinates, not
# secrets. Their values are common words that appear incidentally in vendored
# dependencies and build caches, so exclude just these keys from secrets scanning.
# GITHUB_TOKEN is deliberately left in scope.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_OWNER,GITHUB_REPO,GITHUB_BRANCH"

  # Turbopack records the environment variables a compilation depended on inside its
  # incremental cache, so server-only values such as EDITOR_PASSWORD_HASH appear in
  # .next/cache. These caches are build-time only and are never uploaded with the
  # deploy, so exclude just the cache directories. Every deployed artifact is still
  # scanned, and no secret key is exempted by value.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache,.netlify/.next/cache"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preserve locale-prefixed deep links when Netlify receives a direct browser request.
[[redirects]]
  from = "/:locale/article/:slug"
  to = "/:locale/research/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/article/:slug"
  to = "/en/research/:slug"
  status = 301
  force = true
